name: Build DSH APK with WebView 154

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          

      - name: 接受 Android SDK 许可证
        run: yes | sdkmanager --licenses || true

      - name: 下载并放置 WebView 154 内核
        run: |
          mkdir -p app/src/main/assets/webview
          wget -O app/src/main/assets/webview/webview.apk "https://github.com/zhaojiahang-max/dsh-mobile-apk/releases/download/1.0/com.google.android.webview_154.0.8037.101-803710103_minAPI29.arm64-v8a.armeabi-v7a.nodpi._apkmirror.com.apk"

      - name: 赋予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
